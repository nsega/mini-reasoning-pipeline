[project]
name = "mini-reasoning-pipeline"
version = "0.1.0"
description = "Minimal reasoning pipeline: one verifier, three roles (evaluation, reward, validation)"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "transformers>=4.51",
    "sympy>=1.13",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
